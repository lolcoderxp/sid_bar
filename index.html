                    container.removeChild(container.firstChild);
                }
                
                this.data.forEach(plan => {
                    const card = this._createCard(plan);
                    container.appendChild(card);
                });
            },
            
            _createCard(plan) {
                const card = document.createElement('div');
                card.className = 'plan-card' + (plan.featured ? ' featured' : '');
                
                // بج
                if (plan.badge) {
                    const badge = document.createElement('div');
                    badge.className = `plan-badge ${plan.badge.type}`;
                    badge.textContent = plan.badge.text;
                    card.appendChild(badge);
                }
                
                // لوگو
                const logo = document.createElement('div');
                logo.className = 'plan-logo';
                const logoIcon = document.createElement('div');
                logoIcon.className = 'plan-logo-icon';
                const logoI = document.createElement('i');
                logoI.className = `fa-solid ${plan.icon}`;
                logoI.setAttribute('aria-hidden', 'true');
                logoIcon.appendChild(logoI);
                logo.appendChild(logoIcon);
                const planName = document.createElement('div');
                planName.className = 'plan-name';
                planName.textContent = plan.name;
                logo.appendChild(planName);
                card.appendChild(logo);
                
                // قیمت
                const priceDiv = document.createElement('div');
                priceDiv.className = 'plan-price';
                const priceValue = document.createElement('div');
                priceValue.className = 'plan-price-value';
                priceValue.textContent = plan.price === 0 ? '۰' : UI.toPersianPrice(plan.price);
                priceDiv.appendChild(priceValue);
                const pricePeriod = document.createElement('div');
                pricePeriod.className = 'plan-price-period';
                pricePeriod.textContent = plan.period;
                priceDiv.appendChild(pricePeriod);
                card.appendChild(priceDiv);
                
                // اعتبار
                const validity = document.createElement('div');
                validity.className = 'plan-validity';
                validity.textContent = plan.validity;
                card.appendChild(validity);
                
                // دکمه خرید
                const buyBtn = document.createElement('button');
                buyBtn.type = 'button';
                buyBtn.className = 'plan-buy-btn';
                if (plan.buttonDisabled) {
                    buyBtn.disabled = true;
                    buyBtn.style.opacity = '0.5';
                    buyBtn.style.cursor = 'not-allowed';
                }
                const buyIcon = document.createElement('i');
                buyIcon.className = plan.buttonDisabled ? 'fa-solid fa-check' : 'fa-solid fa-cart-shopping';
                buyIcon.setAttribute('aria-hidden', 'true');
                buyBtn.appendChild(buyIcon);
                const buyText = document.createElement('span');
                buyText.textContent = plan.buttonText;
                buyBtn.appendChild(buyText);
                
                if (!plan.buttonDisabled) {
                    buyBtn.addEventListener('click', () => {
                        Actions.buyPlan(plan.name, plan.price);
                    });

                card.appendChild(buyBtn);
                
                // ویژگی‌ها
                const features = document.createElement('div');

        /* ============================================ */
        /* ===== File Upload (امن) ===== */
        /* ============================================ */
        
        const FileUpload = {
            init() {
                const fileInput = document.getElementById('file-input');
                const avatarTrigger = document.getElementById('avatarTrigger');
                const avatarImg = document.getElementById('avatar-img');
                
                if (!fileInput || !avatarImg) return;
                
                avatarTrigger?.addEventListener('click', () => fileInput.click());
                avatarTrigger?.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        fileInput.click();
                    }
                });
                
                fileInput.addEventListener('change', async (e) => {
                    const file = e.target.files?.[0];
                    if (!file) return;
                    
                    try {
                        Validator.imageFile(file);
                        
                        // استفاده از createObjectURL به جای FileReader برای امنیت بیشتر
                        const url = URL.createObjectURL(file);
                        avatarImg.src = url;
                        
                        // آزادسازی بعد از لود
                        avatarImg.onload = () => {
                            URL.revokeObjectURL(url);
                        };
                        
                        Toast.show('آواتار با موفقیت تغییر یافت', 'success');
                    } catch (err) {
                        Toast.show(err.message, 'error');
                    } finally {
                        // پاک کردن input
                        fileInput.value = '';
                    }
                });
            }
        };

        /* ============================================ */
        /* ===== Security: Protection Against DevTools ===== */
        /* ============================================ */
        
        const Security = {
            init() {
                // جلوگیری از راست‌کلیک (اختیاری - می‌تونی حذف کنی)
                // document.addEventListener('contextmenu', (e) => e.preventDefault());
                
                // جلوگیری از drag تصاویر
                document.querySelectorAll('img').forEach(img => {
                    img.setAttribute('draggable', 'false');
                });
                
                // جلوگیری از iframe
                if (window.self !== window.top) {
                    // اگه داخل iframe هستیم، خارج شو
                    try {
                        window.top.location = window.self.location;
                    } catch (e) {
                        document.body.innerHTML = '<div style="color: white; padding: 40px; text-align: center; font-family: sans-serif;">این صفحه در iframe قابل نمایش نیست.</div>';
                    }
                }
                
                // چک کردن integrity دوره‌ای
                this.verifyEnvironment();
            },
            
            verifyEnvironment() {
                // چک کردن اینکه توابع حیاتی دستکاری نشدن
                const originalParseInt = window.parseInt;
                const originalStringify = JSON.stringify;
                
                setInterval(() => {
                    if (window.parseInt !== originalParseInt) {
                        console.error('Security: parseInt tampered!');
                    }
                    if (JSON.stringify !== originalStringify) {
                        console.error('Security: JSON.stringify tampered!');
                    }
                }, 5000);
            }
        };

        // اجرای برنامه وقتی DOM آماده شد
